<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>wmoney</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#111111">
<link rel="apple-touch-icon" sizes="180x180" href="icons/wm-touch-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="wmoney">
<link rel="icon" href="icons/favicon-light.png" media="(prefers-color-scheme: light)">
<link rel="icon" href="icons/favicon-dark.png" media="(prefers-color-scheme: dark)">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js" integrity="sha384-GFr3yTh5lJznCbZfpTtXnwboFsxqtTQoeTZCRHhE0579KrRmlCzen5AA8ohaB5ug" crossorigin="anonymous"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;700&family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #ffffff;
  --surface: #ffffff;
  --surface-2: #eef3fb;
  --border: #dbe3f0;
  --text: #0f1b33;
  --muted: #5b6b86;
  --primary: #111111;
  --primary-2: #3a3a3a;
  --primary-soft: #ececec;
  --on-primary: #ffffff;
  --in: #0f9d6b;
  --out: #d9485f;
  --daily: #eab308;
  --save: #4ade80;
  --card: #2563eb;
  --neg: #d9485f;
  --pos-rgb: 17, 17, 17;
  --in-rgb: 15, 157, 107;
  --on-strong: #ffffff;
  --neg-rgb: 217, 72, 95;
  --shadow: 0 1px 2px rgba(15, 27, 51, .06), 0 8px 24px rgba(15, 27, 51, .06);
  --radius: 14px;
  --logo-box: transparent; --logo-ink: #111111; --logo-pad: 0%; --logo-line: transparent;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --surface: #141414; --surface-2: #222222; --border: #333333;
    --text: #f2f2f2; --muted: #a0a0a0; --primary: #f2f2f2; --primary-2: #c8c8c8; --on-primary: #111111;
    --primary-soft: #2a2a2a; --in: #34d399; --out: #fb7185; --daily: #facc15;
    --save: #86efac; --card: #60a5fa; --neg: #fb7185; --pos-rgb: 242, 242, 242; --neg-rgb: 251, 113, 133; --in-rgb: 52, 211, 153; --on-strong: #0b1a14;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); color-scheme: dark; --logo-box: #111111; --logo-ink: #ffffff; --logo-pad: 20%; --logo-line: #3a3a3a;
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --surface: #141414; --surface-2: #222222; --border: #333333;
  --text: #f2f2f2; --muted: #a0a0a0; --primary: #f2f2f2; --primary-2: #c8c8c8; --on-primary: #111111;
  --primary-soft: #2a2a2a; --in: #34d399; --out: #fb7185; --daily: #facc15;
  --save: #86efac; --card: #60a5fa; --neg: #fb7185; --pos-rgb: 242, 242, 242; --neg-rgb: 251, 113, 133; --in-rgb: 52, 211, 153; --on-strong: #0b1a14;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); color-scheme: dark; --logo-box: #111111; --logo-ink: #ffffff; --logo-pad: 20%; --logo-line: #3a3a3a;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font-family: Nunito, system-ui, sans-serif; font-weight: 800; font-size: 14px; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
.num { font-family: Arimo, Arial, sans-serif; font-weight: 400; font-variant-numeric: tabular-nums; font-size: 12.5px; }

/* header */
header.top { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); }
.top-inner { max-width: 1280px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 20px; }
.top-actions { display: flex; align-items: center; gap: 10px; flex: none; }
.user-menu { position: relative; }
.user-btn { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface); color: var(--text); display: grid; place-items: center; cursor: pointer; padding: 0; }
.user-btn svg { width: 20px; height: 20px; }
.user-btn:hover, .user-btn[aria-expanded="true"] { background: var(--surface-2); }
.user-pop { position: absolute; right: 0; top: calc(100% + 8px); min-width: 220px; padding: 6px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: 0 12px 32px rgba(8, 15, 30, .18); z-index: 40; }
.user-pop[hidden] { display: none; }
.user-email { padding: 8px 10px 10px; font-size: 12.5px; color: var(--muted); border-bottom: 1px solid var(--border); margin-bottom: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.user-pop button { display: block; width: 100%; text-align: left; padding: 9px 10px; border: 0; background: none; border-radius: 9px; cursor: pointer; color: var(--text); }
.user-pop button:hover { background: var(--surface-2); }
/* the wmoney mark: plain black on light pages, white inside a black box on dark ones */
.logo { width: var(--s, 34px); height: var(--s, 34px); flex: none; position: relative; border-radius: 24%; background: var(--logo-box); box-shadow: inset 0 0 0 1px var(--logo-line); }
.logo::before { content: ""; position: absolute; inset: var(--logo-pad); background: var(--logo-ink); -webkit-mask: url(icons/mark.png) center / contain no-repeat; mask: url(icons/mark.png) center / contain no-repeat; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 900; font-size: 22px; letter-spacing: -.01em; white-space: nowrap; }
.brand small { display: block; font-weight: 500; font-size: 11px; color: var(--muted); letter-spacing: 0; }
nav.tabs { display: flex; gap: 4px; flex: 1; }
nav.tabs a { text-decoration: none; color: var(--muted); font-weight: 600; padding: 8px 12px; border-radius: 10px; display: flex; align-items: center; gap: 7px; }
nav.tabs a { position: relative; }
nav.tabs a:hover { background: none; color: var(--text); }
nav.tabs a:hover::after { content: ""; position: absolute; left: 8px; right: 8px; bottom: -2px; height: 3px; border-radius: 3px; background: var(--border); }
/* the open page is underlined, not filled */
nav.tabs a.active { background: none; color: var(--text); position: relative; }
nav.tabs a.active::after { content: ""; position: absolute; left: 8px; right: 8px; bottom: -2px; height: 3px; border-radius: 3px; background: var(--primary); }
nav.tabs svg { width: 17px; height: 17px; }
.btn { border: 1px solid var(--border); background: var(--surface); padding: 8px 14px; border-radius: 10px; cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: linear-gradient(135deg, var(--primary), var(--primary-2)); color: var(--on-primary); border: 0; }
.btn.primary:hover { filter: brightness(1.05); }
.btn.danger { color: var(--neg); }
.btn.small { padding: 5px 10px; font-size: 12.5px; }
.icon-btn { border: 1px solid var(--border); background: var(--surface); width: 34px; height: 34px; border-radius: 10px; cursor: pointer; display: inline-grid; place-items: center; }
.icon-btn:hover { background: var(--surface-2); }

main { max-width: 1280px; margin: 0 auto; padding: 20px 16px 110px; }
.page-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.page-head h1 { font-size: 22px; margin: 0; letter-spacing: -.02em; }
.page-head p { margin: 2px 0 0; color: var(--muted); }
.range { display: flex; align-items: center; gap: 6px; }
.range .label { font-weight: 700; min-width: 150px; text-align: center; }

/* kpi strip */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 18px; }
.kpi { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); }
.kpi .k { color: var(--muted); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.kpi .v { font-size: clamp(17px, 4.6vw, 22px); font-weight: 800; margin-top: 6px; letter-spacing: -.02em; white-space: nowrap; }
.kpi .s { color: var(--muted); font-size: 12px; margin-top: 2px; }
.neg { color: var(--neg) !important; }
.pos { color: var(--in); }

/* month tables */
.month { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 18px; overflow: hidden; }
.month-head { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--border); }
.month-head h2 { margin: 0; font-size: 15px; text-transform: capitalize; }
.month-head .end { color: var(--muted); font-size: 12.5px; }
.scroll { overflow-x: auto; }
table.flow { width: 100%; border-collapse: collapse; min-width: 760px; }
table.flow th { text-align: right; font-size: 11.5px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; padding: 8px 12px; background: var(--surface); white-space: nowrap; }
table.flow th:first-child, table.flow td:first-child { text-align: left; }
table.flow th .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
table.flow td { text-align: right; padding: 7px 12px; border-top: 1px solid var(--border); white-space: nowrap; }
table.flow tbody tr { cursor: pointer; }
table.flow tbody tr:hover td { background: var(--surface-2); }
table.flow td.zero { color: color-mix(in srgb, var(--muted) 55%, transparent); }
table.flow td.day { font-weight: 700; width: 70px; }
table.flow td.day span { color: var(--muted); font-weight: 500; font-size: 11.5px; margin-left: 4px; }
table.flow tr.weekend td.day { color: var(--muted); }
table.flow tr.today td:not(.bal) { background: var(--primary-soft) !important; }
table.flow tr.today td.day::after { content: "hoje"; margin-left: 6px; font-size: 10px; font-weight: 800; color: var(--on-primary); background: var(--primary); border-radius: 6px; padding: 1px 6px; text-transform: uppercase; }
table.flow td.bal { font-weight: 700; }
table.flow tfoot td { font-weight: 800; background: var(--surface); border-top: 2px solid var(--border); }
.forecast { opacity: .75; }

/* same cell look as the phone grid: boxed cells, grey day column, coloured balance cells */
table.flow td { border-top: 1px solid var(--border); }
table.flow td + td, table.flow th + th { border-left: 1px solid var(--border); }
table.flow td.day { background: var(--surface); }
/* like the phone list: weekdays white, weekends light gray, today black */
table.flow tr.weekend td.day { background: color-mix(in srgb, var(--muted) 20%, var(--surface)); }
table.flow tr.today td:not(.bal) { background: transparent !important; }
table.flow tr.today td.day { background: var(--primary) !important; color: var(--on-primary); }
table.flow tr.today td.day span { color: rgba(255, 255, 255, .8); }
table.flow tr.today td.day::after { display: none; }
table.flow tbody tr:hover td:not(.bal):not(.day) { background: var(--surface-2); }
table.flow td.zero { color: color-mix(in srgb, var(--muted) 45%, transparent); }
table.flow td.bal.pos { background: color-mix(in srgb, var(--in) 24%, var(--surface)); color: color-mix(in srgb, var(--in) 75%, var(--text)); }
table.flow td.bal.neg { background: color-mix(in srgb, var(--neg) 22%, var(--surface)); }
/* phone-style cells: taller rows, day number over the weekday, a colour dot per value */
table.flow td { padding-top: 4px; padding-bottom: 4px; }
table.flow td.day { width: 56px; text-align: center !important; line-height: 1.1; }
table.flow th:first-child { text-align: center; }
table.flow td.day b { display: block; font-size: 14px; }
table.flow td.day span { display: block; margin-left: 0; font-size: 10px; }
table.flow tr.weekend td.day b { color: var(--muted); }
table.flow tr.today td.day b { color: var(--on-primary); }
table.flow .cv { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
table.flow .cv .tdot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); flex: none; opacity: .25; }
table.flow .cv.has .tdot { opacity: 1; }
table.flow td.bal { font-size: 13.5px; }
/* table numbers: Arimo Regular with equal-width digits, like the phone list and Horizonte */
table.flow td.num { font-family: Arimo, Arial, sans-serif; font-variant-numeric: tabular-nums; }
table.flow tbody td.num { font-weight: 400; }

/* compact day list used instead of the wide table on phones */
.dlist, .chip-legend { display: none; }
.drow { display: flex; align-items: center; gap: 10px; padding: 9px 14px; border-top: 1px solid var(--border); cursor: pointer; }
.drow:first-child { border-top: 0; }
.drow:active { background: var(--surface-2); }
.drow .dd { width: 34px; flex: none; line-height: 1.15; }
.drow .dd b { display: block; font-size: 15px; }
.drow .dd span { font-size: 11px; color: var(--muted); }
.drow.weekend .dd b { color: var(--muted); }
.drow .chips { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; gap: 4px; }
.drow .none { color: color-mix(in srgb, var(--muted) 55%, transparent); font-size: 12px; }
.chip { font-family: Arimo, Arial, sans-serif; font-variant-numeric: tabular-nums; font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 999px; background: color-mix(in srgb, var(--c) 15%, transparent); color: var(--c); white-space: nowrap; }
.chip.fc { opacity: .75; }
.drow .db { font-weight: 700; text-align: right; white-space: nowrap; }
.drow .db.pos { color: var(--in); }
.drow.today { background: var(--primary-soft); }
.drow.today .dd b { color: var(--primary); }
.chip-legend { flex-wrap: wrap; gap: 6px; margin: -4px 0 14px; }
.mbar, .tab-add { display: none; }
.cal-btn { position: relative; width: 42px; height: 42px; border: 1px solid var(--border); background: var(--surface); border-radius: 12px; cursor: pointer; color: var(--primary); display: grid; place-items: center; padding: 0; flex: none; }
.cal-btn svg { width: 34px; height: 34px; }
.mbar-mid { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; gap: 6px; }
.mbar-mid h2 { margin: 0; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-transform: capitalize; }
.mbar-mid .icon-btn { width: 38px; height: 38px; font-size: 20px; flex: none; }
.mbar-hz { width: 42px; height: 42px; flex: none; color: var(--muted); text-decoration: none; }
.mbar-hz.active { background: var(--primary-soft); color: var(--primary); border-color: transparent; }
/* phone top bar: plain icon buttons, no outline boxes */
.mbar .cal-btn, .mbar .icon-btn { border: 0; background: transparent; }
/* tapping them never leaves a highlight: they are shortcuts, not tabs */
.mbar .icon-btn, .mbar .cal-btn { -webkit-tap-highlight-color: transparent; }
.mbar .icon-btn:hover, .mbar .cal-btn:hover, .mbar .mbar-hz.active { background: transparent; }

/* login */
body.locked header.top, body.locked main, body.locked .fab { display: none; }
.auth { display: none; min-height: 100vh; min-height: 100dvh; align-items: center; justify-content: center; padding: 24px 16px; background:
  radial-gradient(900px 500px at 10% -10%, rgba(var(--pos-rgb), .22), transparent 60%),
  radial-gradient(700px 400px at 110% 110%, rgba(56, 189, 248, .18), transparent 60%), var(--bg); }
body.locked .auth { display: flex; }
.auth-card { width: 100%; max-width: 400px; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 28px 24px; box-shadow: var(--shadow); }
.auth-card .brand { margin-bottom: 22px; }
.auth-card h1 { font-size: 20px; margin: 0 0 4px; letter-spacing: -.02em; }
.auth-card .lead { color: var(--muted); margin: 0 0 18px; }
.auth-card .btn.primary { width: 100%; justify-content: center; padding: 11px; font-size: 15px; }
.auth-links { display: flex; justify-content: space-between; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
.auth-links button { background: none; border: 0; padding: 0; color: var(--primary); font-weight: 700; cursor: pointer; }
.auth-msg { margin: 12px 0 0; font-size: 13px; min-height: 1em; }
.auth-msg.err { color: var(--neg); }
.auth-msg.ok { color: var(--in); }
.auth-foot { color: var(--muted); font-size: 12px; margin-top: 18px; display: flex; align-items: center; gap: 6px; }
.loading { color: var(--muted); padding: 60px 0; text-align: center; }

/* the app's own type menu (replaces the system picker) */
.type-menu { position: fixed; z-index: 60; min-width: 210px; padding: 6px; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 12px 32px rgba(8, 15, 30, .22); animation: tm-in .12s ease-out; }
@keyframes tm-in { from { opacity: 0; transform: translateY(-4px); } }
.tm-opt { width: 100%; display: flex; align-items: center; gap: 12px; padding: 11px 12px; border: 0; background: none; border-radius: 10px; color: var(--text); font: inherit; font-size: 15px; font-weight: 600; text-align: left; cursor: pointer; }
.tm-opt:hover, .tm-opt:focus-visible { background: var(--surface-2); outline: none; }
.tm-opt.on { background: color-mix(in srgb, var(--c) 12%, transparent); }
.tm-opt .tdot { width: 12px; height: 12px; border-radius: 50%; background: var(--c); flex: none; }
.tm-opt .tm-name { flex: 1; }
.tm-opt .tm-check { color: var(--primary); visibility: hidden; }
.tm-opt.on .tm-check { visibility: visible; }

/* imported Apple Pay purchases waiting for review */
.inbox-banner { width: 100%; display: flex; align-items: center; gap: 14px; text-align: left; padding: 12px 14px; margin: 0 0 16px; border: 0; border-radius: var(--radius); background: var(--primary); color: var(--on-primary); cursor: pointer; font: inherit; }
.inbox-banner .ib-ico { position: relative; width: 42px; height: 42px; flex: none; border-radius: 12px; display: grid; place-items: center; background: color-mix(in srgb, var(--on-primary) 14%, transparent); }
.inbox-banner .ib-ico svg { width: 22px; height: 22px; }
.inbox-banner .ib-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.inbox-banner .ib-txt b { font-size: 14.5px; }
.inbox-banner small { color: color-mix(in srgb, var(--on-primary) 65%, transparent); font-size: 12px; font-weight: 700; }
.inbox-banner .ib-go { flex: none; padding: 7px 12px; border-radius: 999px; background: var(--on-primary); color: var(--primary); font-weight: 800; font-size: 13px; }
.inbox-banner:hover { filter: brightness(1.15); }
.import-code { background: var(--surface-2); border-radius: 12px; padding: 12px 12px 1px; margin-bottom: 12px; }
.import-steps { margin: 0 0 12px; padding-left: 20px; line-height: 1.55; }
.import-steps li { margin-bottom: 10px; }
.import-steps .field { margin: 6px 0 0; }
.import-steps ul { margin: 6px 0 0; padding-left: 18px; }
.import-steps code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; background: var(--surface-2); padding: 1px 6px; border-radius: 6px; }

/* horizon */
.legend { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
.legend .lg { font-family: Arimo, Arial, sans-serif; font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 6px; }

/* four balance levels used by every coloured balance cell: light up to R$ 1.000, strong beyond */
.lv-neg2 { background: var(--neg) !important; color: var(--on-strong) !important; }
.lv-neg1 { background: color-mix(in srgb, var(--neg) 22%, var(--surface)) !important; color: color-mix(in srgb, var(--neg) 80%, var(--text)) !important; }
.lv-pos1 { background: color-mix(in srgb, var(--in) 22%, var(--surface)) !important; color: color-mix(in srgb, var(--in) 78%, var(--text)) !important; }
.lv-pos2 { background: var(--in) !important; color: var(--on-strong) !important; }
.horizon-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); overflow: auto; }
table.horizon { border-collapse: separate; border-spacing: 3px; padding: 8px; min-width: 980px; width: 100%; }
table.horizon th { font-size: 11.5px; color: var(--muted); font-weight: 700; padding: 4px; text-transform: capitalize; position: sticky; top: 0; background: var(--surface); }
table.horizon td { height: 28px; border-radius: 6px; text-align: center; font-size: 11px; cursor: pointer; }
table.horizon td.dnum { color: var(--muted); font-weight: 700; cursor: default; width: 28px; }
table.horizon td.empty { cursor: default; }
table.horizon td.today { outline: 2px solid var(--primary); outline-offset: 1px; }
table.horizon td:not(.dnum):not(.empty):hover { outline: 2px solid var(--text); }

/* cards */
.grid { display: grid; gap: 14px; }
.grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); }
.panel h3 { margin: 0 0 12px; font-size: 14px; }
.panel .hint { color: var(--muted); font-size: 12.5px; margin: -6px 0 12px; }
.stack { display: flex; height: 14px; border-radius: 8px; overflow: hidden; background: var(--surface-2); margin: 8px 0 14px; }
.stack span { display: block; height: 100%; }
.rows .row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--border); }
.rows .row:first-child { border-top: 0; }
.rows .row .grow { flex: 1; min-width: 0; }
.rows .row .sub { color: var(--muted); font-size: 12px; }
.badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.sw { width: 10px; height: 10px; border-radius: 3px; flex: none; }

.meter span { display: block; height: 100%; border-radius: 6px; }
.empty-state { color: var(--muted); padding: 18px 0; text-align: center; }

/* forms */
.field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
.field label { font-size: 12px; font-weight: 700; color: var(--muted); }
.field input, .field select { border: 1px solid var(--border); background: var(--surface); border-radius: 10px; padding: 9px 11px; outline: none; width: 100%; }
.field input:focus, .field select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(var(--pos-rgb), .18); }
/* iOS draws date fields wider and taller than text inputs; make them match the other fields */
.field input, .field select { box-sizing: border-box; height: 42px; min-width: 0; }
.field input[type="date"] { -webkit-appearance: none; appearance: none; display: block; text-align: left; }
.field input[type="date"]::-webkit-date-and-time-value { text-align: left; margin: 0; }
.inline { display: flex; gap: 10px; }

.seg button .sw { width: 12px; height: 12px; border-radius: 50%; }
.seg button.on { border-color: var(--primary); background: var(--primary-soft); color: var(--primary); }
.amount-input { font-size: 26px !important; font-weight: 800; letter-spacing: -.02em; }
/* masked money fields in Ajustes: right-aligned digits, optional ± toggle on the left */

.money-field { display: flex; gap: 6px; }
.money-field .btn { flex: none; width: 40px; justify-content: center; font-size: 16px; padding: 0; }

/* modal */
.overlay { position: fixed; inset: 0; background: rgba(8, 15, 30, .45); display: none; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
.overlay.open { display: flex; }
.modal { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; width: 100%; max-width: 480px; max-height: calc(100vh - 32px); overflow: auto; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
.modal-head { display: flex; justify-content: space-between; align-items: center; padding: 16px 18px; border-bottom: 1px solid var(--border); }
.modal-head h2 { margin: 0; font-size: 17px; }
.modal-body { padding: 16px 18px; }
.modal-foot { padding: 0 18px 18px; display: flex; gap: 8px; justify-content: flex-end; }

.fab { position: fixed; right: 20px; bottom: 22px; z-index: 30; }
.fab .btn { padding: 13px 20px; border-radius: 14px; font-size: 15px; }
.toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(20px); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 600; opacity: 0; transition: .2s; z-index: 60; pointer-events: none; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* Horizonte grid (phone and web): one column per month, Dia | Saldo, month name pinned on top */
/* on the web the grid grows to fit all 31 days and the 12 months share the width, so it never scrolls inside;
   the page scrolls instead and the month names stay pinned under the top bar */
.hz-phone { display: flex; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
.hz-month { flex: 1 1 0; min-width: 0; border-right: 1px solid var(--border); }
.hz-month:last-child { border-right: 0; }
.hz-head { position: sticky; top: var(--top-h, 57px); z-index: 2; padding: 7px 4px; text-align: center; font-weight: 800; font-size: 12.5px; text-transform: lowercase; background: var(--surface-2); border-bottom: 1px solid var(--border); }
.hz-month.current .hz-head { background: var(--primary); color: var(--on-primary); }
.hz-grid { display: grid; grid-template-columns: 26px 1fr; }
.hz-d, .hz-v { height: 26px; display: flex; align-items: center; border-bottom: 1px solid var(--border); font-size: 11.5px; }
.hz-d { justify-content: center; font-weight: 700; color: var(--muted); background: var(--surface-2); }
.hz-d.today { background: var(--primary); color: var(--on-primary); }
.hz-v { justify-content: flex-end; padding: 0 7px; font-weight: 600; cursor: pointer; }
.hz-v { font-family: Arimo, Arial, sans-serif; font-weight: 400; font-variant-numeric: tabular-nums; }
.hz-v:not(.empty):hover { box-shadow: inset 0 0 0 2px var(--text); }
.hz-v.today { box-shadow: inset 0 0 0 2px var(--primary); }
.hz-v.empty { cursor: default; }
@media (max-width: 900px) {
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid.two { grid-template-columns: 1fr; }
  nav.tabs a span { display: none; }
}
@media (max-width: 640px) {
  /* backdrop-filter would make the header the containing block for the fixed tab bar */

  .top-inner { gap: 10px; padding: 8px 10px; }

  nav.tabs a[data-r="horizonte"], nav.tabs a[data-r="importar"] { display: none; }

  .fab, .top-actions { display: none; }
  nav.tabs { align-items: center; }
  .tab-add { display: grid; place-items: center; width: 46px; height: 46px; border: 0; border-radius: 50%; background: linear-gradient(135deg, var(--primary), var(--primary-2)); color: var(--on-primary); cursor: pointer; flex: none; }
  .tab-add svg { width: 22px; height: 22px; }

  main { padding-bottom: var(--nav-h, calc(58px + env(safe-area-inset-bottom))); }
  nav.tabs { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-top: 1px solid var(--border); justify-content: space-around; padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); z-index: 25; }
  nav.tabs a { flex-direction: column; gap: 2px; font-size: 10.5px; padding: 6px; }

  nav.tabs a.active { background: none; position: relative; }

  nav.tabs a.active::before { content: ""; position: absolute; top: -7px; left: 4px; right: 4px; height: 3px; border-radius: 0 0 3px 3px; background: var(--primary); }
  .fab { bottom: 78px; right: 16px; }
  .range .label { min-width: 0; }
  .seg { grid-template-columns: repeat(3, 1fr); }
  .month .scroll { display: none; }
  .dlist { display: block; }
  .chip-legend { display: flex; }
  .month-head { padding: 12px 14px; }
  /* Fluxo on phones: only the months, edge to edge, with the month name pinned under the top bar */
  body[data-route="fluxo"] .page-head,
  body[data-route="fluxo"] .kpis,
  body[data-route="fluxo"] .chip-legend { display: none; }
  body[data-route="fluxo"] main { padding-left: 0; padding-right: 0; padding-top: 0; }
  body[data-route="fluxo"] .month { border-radius: 0; border-left: 0; border-right: 0; border-top: 0; box-shadow: none; margin-bottom: 0; overflow: visible; }
  body[data-route="fluxo"] .month-head { position: sticky; top: var(--top-h, 55px); z-index: 5; background: var(--surface-2); }
  .phone-head { gap: 8px; padding: 8px 10px; }
  .phone-head .mh-mid { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; min-width: 0; }
  .phone-head h2 { font-size: 16px; white-space: nowrap; }
  .phone-head .icon-btn { width: 40px; height: 40px; font-size: 20px; }
  body[data-route="fluxo"] .inbox-banner { margin: 0; border-radius: 0; }
  /* Resumo, Categorias and Horizonte on phones: the page name is already in the top bar,
     so drop the title and centre the month picker (and the Horizonte legend) */
  body:is([data-route="resumo"], [data-route="categorias"], [data-route="horizonte"]) .page-head > div:first-child { display: none; }
  body:is([data-route="resumo"], [data-route="categorias"], [data-route="horizonte"]) .page-head { justify-content: center; }
  body[data-route="horizonte"] .page-head > div:last-child { justify-content: center; }
  /* the calendar in the top bar already jumps to today, and the colours speak for themselves */
  body[data-route="horizonte"] .page-head .legend,
  body[data-route="horizonte"] .page-head [data-act="today"] { display: none; }
  /* Horizonte on phones: one column per month (Dia | Saldo), ~3 on screen, snapping sideways;
     the grid scrolls inside the free height so the month names stay pinned on top */
  body[data-route="horizonte"] main { padding: 8px 0 0; height: calc(100dvh - var(--top-h, 55px) - var(--nav-h, calc(58px + env(safe-area-inset-bottom)))); display: flex; flex-direction: column; }
  body[data-route="horizonte"] .page-head { margin-bottom: 8px; }
  .hz-phone { flex: 1 1 auto; min-height: 0; overflow-x: hidden; overflow-y: auto; border-radius: 0; border-left: 0; border-right: 0; border-bottom: 0; box-shadow: none; }

  .hz-d, .hz-v { height: 38px; font-size: 12.5px; }
  /* phone list: Dia | chosen type | Saldo, as a three-column grid with a pinned header row */
  .list-head, body[data-route="fluxo"] .drow { display: grid; grid-template-columns: 58px minmax(0, 1fr) minmax(0, 44%); }
  .list-head { position: sticky; top: var(--top-h, 55px); z-index: 6; align-items: center; background: var(--surface); border-bottom: 2px solid var(--border); padding: 8px 0; font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .list-head > span:first-child { text-align: center; }
  .list-head > span:last-child { text-align: right; padding-right: 14px; }
  .type-pick { position: relative; justify-self: start; margin-left: 8px; display: inline-flex; align-items: center; gap: 7px; padding: 7px 12px; border: 1px solid var(--border); border-radius: 999px; background: var(--surface); color: var(--text); text-transform: none; letter-spacing: 0; font-size: 14px; font-weight: 700; max-width: 100%; }
  .type-pick .tname { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .type-pick svg { color: var(--muted); flex: none; }

  .type-pick[aria-expanded="true"] { border-color: var(--c); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 18%, transparent); }
  .type-pick[aria-expanded="true"] svg { transform: rotate(180deg); }
  .tdot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); flex: none; }
  body[data-route="fluxo"] .drow { padding: 0; gap: 0; min-height: 48px; align-items: stretch; }
  body[data-route="fluxo"] .drow > div { display: flex; align-items: center; min-width: 0; }
  body[data-route="fluxo"] .drow .dd { width: auto; flex-direction: column; justify-content: center; border-right: 1px solid var(--border); background: var(--surface); }
  body[data-route="fluxo"] .drow.weekend .dd { background: color-mix(in srgb, var(--muted) 20%, var(--surface)); }
  body[data-route="fluxo"] .drow .dd b { font-size: 16px; }
  body[data-route="fluxo"] .drow.today { background: none; }
  body[data-route="fluxo"] .drow.today .dd { background: var(--primary); }
  body[data-route="fluxo"] .drow.today .dd b, body[data-route="fluxo"] .drow.today .dd span { color: var(--on-primary); }
  .amt { padding: 0; border-right: 1px solid var(--border); overflow: hidden; }
  /* the column is a strip of three panes (previous · current · next type) that follows the finger */
  .phone-month { touch-action: pan-y; }
  .amt .track { display: flex; width: 100%; height: 100%; transform: translateX(calc(-100% + var(--sx, 0px))); }
  .amt .pane { flex: 0 0 100%; min-width: 0; box-sizing: border-box; padding: 0 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .dlist.sliding .amt .track { transition: transform 140ms ease-out; }
  .pane .tdot { opacity: .25; }
  .pane.has .tdot { opacity: 1; }
  .tval { font-family: Arimo, Arial, sans-serif; font-size: 15px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tval.fc { opacity: .7; }
  .tval.zero { color: color-mix(in srgb, var(--muted) 45%, transparent); font-weight: 500; }
  /* numbers in the list: Arimo Regular with equal-width digits */
  body[data-route="fluxo"] .drow .tval, body[data-route="fluxo"] .drow .db { font-family: Arimo, Arial, sans-serif; font-weight: 400; font-variant-numeric: tabular-nums; }
  body[data-route="fluxo"] .drow .db { justify-content: flex-end; padding: 0 14px; font-size: 15.5px; }

  body[data-route="fluxo"] .drow .db.neg { background: color-mix(in srgb, var(--neg) 22%, var(--surface)); color: color-mix(in srgb, var(--neg) 80%, var(--text)); }

/* Importar: invoice reader */

  .inv-head { display: none; }
  /* phones: date, installment and value on one line, the description under it, then status and what to do */
  .inv-row { grid-template-columns: minmax(0, 1fr) 56px minmax(0, 1fr); grid-template-areas: "date parc amount" "desc desc desc" "tag tag tag" "st st act"; padding: 10px; gap: 6px 8px; }
